# Custom VPS: Traefik + bind-mounted ./data. Pulls a published image (no local build).
# Private registry: docker login nefarius.azurecr.io may be required before compose up/pull.
# Long-lived SSE (e.g. job events): raise Traefik forwarding timeouts to match max job duration.

services:
  signrelay:
    image: nefarius.azurecr.io/signrelay:latest
    environment:
      TZ: Europe/Vienna
      ASPNETCORE_ENVIRONMENT: Production
      SignRelay__StoragePath: /data
      SignRelay__CiToken: ${SIGN_RELAY_CI_TOKEN:?set SIGN_RELAY_CI_TOKEN}
      SignRelay__AgentToken: ${SIGN_RELAY_AGENT_TOKEN:?set SIGN_RELAY_AGENT_TOKEN}
    volumes:
      - ./data:/data
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      # Image HEALTHCHECK is the same; compose override keeps local/prod in sync.
      # Omitting this block does NOT disable the image HEALTHCHECK — use
      # `healthcheck: { disable: true }` for that (e.g. temporary Traefik unblock).
      test: ["CMD", "dotnet", "SignRelay.Server.dll", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - "traefik.http.routers.signrelay.rule=Host(`${SIGNRELAY_TRAEFIK_HOST:?set SIGNRELAY_TRAEFIK_HOST}`)"
      - traefik.http.routers.signrelay.entrypoints=web-secure
      - traefik.http.routers.signrelay.tls=true
      - traefik.http.routers.signrelay.tls.certresolver=le
      - traefik.http.services.signrelay.loadbalancer.server.port=8080

networks:
  web:
    external: true
