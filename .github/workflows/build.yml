name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SignRelay.sln

      - name: Build
        run: dotnet build SignRelay.sln -c Release --no-restore

      - name: Test
        run: dotnet test SignRelay.sln -c Release --no-build --verbosity normal

      - name: Vulnerability scan
        run: dotnet list SignRelay.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build server image
        run: docker build -f docker/Dockerfile --build-arg MINVERVERSIONOVERRIDE=0.0.0-ci -t signrelay/server:ci .

      - name: Smoke test container health
        run: |
          docker run -d --name signrelay-ci \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e SignRelay__CiToken=ci-test-token-12345678 \
            -e SignRelay__AgentToken=agent-test-token-12345678 \
            -p 18080:8080 \
            signrelay/server:ci
          # Wait for the container to become healthy
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18080/health; then
              echo "Health check passed."
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Container never became healthy."
              docker logs signrelay-ci
              exit 1
            fi
            sleep 2
          done
          docker stop signrelay-ci

  publish-cli:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v5
        with:
          global-json-file: global.json

      - name: Pack CLI (global tool NuGet)
        run: dotnet pack src/SignRelay.Cli/SignRelay.Cli.csproj -c Release -o ./artifacts/nuget

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
