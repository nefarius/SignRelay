# LOCAL DEVELOPMENT ONLY.
# ASPNETCORE_ENVIRONMENT=Development relaxes token validation and enables Swagger.
# For production, use ../docker-compose.prod.yml (or set Production + strong ≥32-char tokens).
services:
  signrelay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Same as NUKE DockerServer: MinVer version without copying .git into the image. Set before `docker compose build`, e.g.
      #   export MINVERVERSIONOVERRIDE=$(dotnet msbuild src/SignRelay.Server/SignRelay.Server.csproj -restore -getProperty:Version -nologo -verbosity:quiet)
      args:
        MINVERVERSIONOVERRIDE: ${MINVERVERSIONOVERRIDE:?set MINVERVERSIONOVERRIDE before building}
    # Bind to localhost only for local dev; remove 127.0.0.1: if you need LAN access
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SignRelay__StoragePath: /data
      SignRelay__CiToken: ${SIGN_RELAY_CI_TOKEN:?set SIGN_RELAY_CI_TOKEN}
      SignRelay__AgentToken: ${SIGN_RELAY_AGENT_TOKEN:?set SIGN_RELAY_AGENT_TOKEN}
    volumes:
      - signrelay-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "SignRelay.Server.dll", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  signrelay-data:
