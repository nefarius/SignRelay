services:
  signrelay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Same as NUKE DockerServer: MinVer version without copying .git into the image. Set before `docker compose build`, e.g.
      #   export MINVERVERSIONOVERRIDE=$(dotnet msbuild src/SignRelay.Server/SignRelay.Server.csproj -restore -getProperty:Version -nologo -verbosity:quiet)
      args:
        MINVERVERSIONOVERRIDE: ${MINVERVERSIONOVERRIDE:-}
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SignRelay__StoragePath: /data
      SignRelay__CiToken: ${SIGN_RELAY_CI_TOKEN:?set SIGN_RELAY_CI_TOKEN}
      SignRelay__AgentToken: ${SIGN_RELAY_AGENT_TOKEN:?set SIGN_RELAY_AGENT_TOKEN}
    volumes:
      - signrelay-data:/data
    restart: unless-stopped

volumes:
  signrelay-data:
